name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for triggering the workflow run'
        required: false
        default: "Manual trigger"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  build-and-lint:
    name: Swift 6.4
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: "27.0"

    - name: Verify bundled Swift toolchain
      run: swift --version | grep -E 'Swift version 6\.4([. ]|$)'
    
    - name: Install validation tools
      run: |
        brew install shellcheck
        validation_tools_dir="${{ runner.temp }}/axorcist-validation-tools"
        scripts/install-validation-tools.sh "$validation_tools_dir"
        echo "$validation_tools_dir" >> "$GITHUB_PATH"
    
    - name: Verify release workflow boundaries
      run: node --test .github/scripts/test-release-workflow.mjs

    - name: Run safe tests
      run: swift test
    
    - name: Run formatting and linting checks
      run: make check

    - name: Verify CLI release packaging
      shell: bash
      run: |
        arch -x86_64 /usr/bin/true || softwareupdate --install-rosetta --agree-to-license
        arch -x86_64 /usr/bin/true
        shellcheck scripts/*.sh
        version="$(sed -n 's/.*axorcVersion = "\([^"]*\)".*/\1/p' Sources/axorc/Models/AXORCModels.swift)"
        umask 077
        scripts/verify-release-packaging.sh "$version"
        verify_dir="$(mktemp -d)"
        trap 'rm -rf "$verify_dir"' EXIT
        for architecture in universal arm64 x86_64; do
          archive="dist/axorc-$version-macos-$architecture.zip"
          test "$(unzip -Z1 "$archive")" = "axorc"
          (cd dist && shasum -a 256 -c "$(basename "$archive").sha256")
          mkdir "$verify_dir/$architecture"
          ditto -x -k "$archive" "$verify_dir/$architecture"
          binary="$verify_dir/$architecture/axorc"
          test "$(stat -f '%Lp' "$binary")" = 755
          codesign --verify --strict "$binary"
          if [[ "$architecture" == universal ]]; then
            for expected_arch in arm64 x86_64; do
              lipo "$binary" -verify_arch "$expected_arch"
            done
          else
            test "$(lipo -archs "$binary")" = "$architecture"
            test "$(stat -f '%z' "$archive")" -lt "$(stat -f '%z' "dist/axorc-$version-macos-universal.zip")"
          fi
          for target_arch in arm64 x86_64; do
            if [[ "$architecture" == universal || "$architecture" == "$target_arch" ]]; then
              xcrun vtool -arch "$target_arch" -show-build "$binary" | awk '$1 == "minos" { found=1; if ($2 != "14.0") exit 1 } END { if (!found) exit 1 }'
              arch "-$target_arch" "$binary" --version | grep -Fx "axorc $version"
              arch "-$target_arch" "$binary" --help >/dev/null
            fi
          done
        done
        scripts/render-homebrew-formula.sh "$version" --artifacts dist > /tmp/axorc.rb
        grep -Fq 'skip_clean "bin/axorc"' /tmp/axorc.rb
        ruby -c /tmp/axorc.rb

    - name: Retain ad-hoc packaging artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: axorc-adhoc-${{ github.sha }}
        path: |
          dist/axorc-*-macos-*.zip
          dist/axorc-*-macos-*.zip.sha256
        if-no-files-found: error
        retention-days: 7
