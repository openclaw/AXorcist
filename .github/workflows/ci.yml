name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for triggering the workflow run'
        required: false
        default: "Manual trigger"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-lint:
    name: Swift ${{ matrix.swift }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "6.2.4"
            xcode: "16.4"
            validate: true
          - swift: "6.3.3"
            xcode: "26.3"
            validate: false

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: ${{ matrix.xcode }}
    
    - name: Install Swift toolchain
      uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
      with:
        swift-version: ${{ matrix.swift }}
    
    - name: Install validation tools
      if: matrix.validate
      run: |
        brew install shellcheck
        validation_tools_dir="${{ runner.temp }}/axorcist-validation-tools"
        scripts/install-validation-tools.sh "$validation_tools_dir"
        echo "$validation_tools_dir" >> "$GITHUB_PATH"
    
    - name: Run safe tests
      run: swift test
    
    - name: Run formatting and linting checks
      if: matrix.validate
      run: make check

    - name: Verify CLI release packaging
      if: matrix.validate
      shell: bash
      run: |
        shellcheck scripts/*.sh
        version="$(sed -n 's/.*axorcVersion = "\([^"]*\)".*/\1/p' Sources/axorc/Models/AXORCModels.swift)"
        scripts/build-release-artifact.sh "$version" --adhoc
        archive="dist/axorc-$version-macos-universal.zip"
        test "$(unzip -Z1 "$archive")" = "axorc"
        (cd dist && shasum -a 256 -c "$(basename "$archive").sha256")
        sha256="$(shasum -a 256 "$archive" | awk '{print $1}')"
        scripts/render-homebrew-formula.sh "$version" "$sha256" > /tmp/axorc.rb
        grep -Fq 'skip_clean "bin/axorc"' /tmp/axorc.rb
        ruby -c /tmp/axorc.rb
