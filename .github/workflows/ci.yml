name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for triggering the workflow run'
        required: false
        default: "Manual trigger"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-lint:
    name: Swift ${{ matrix.swift }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "6.2.4"
            xcode: "16.4"
            runner: macos-15
            validate: true
          - swift: "6.4.0"
            xcode: "27.0"
            runner: xcode-27
            validate: false

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: ${{ matrix.xcode }}
    
    - name: Install Swift toolchain
      if: matrix.validate
      uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
      with:
        swift-version: ${{ matrix.swift }}

    - name: Verify bundled latest Swift toolchain
      if: ${{ !matrix.validate }}
      run: swift --version | grep -E 'Swift version 6\.4([. ]|$)'
    
    - name: Install validation tools
      if: matrix.validate
      run: |
        brew install shellcheck
        validation_tools_dir="${{ runner.temp }}/axorcist-validation-tools"
        scripts/install-validation-tools.sh "$validation_tools_dir"
        echo "$validation_tools_dir" >> "$GITHUB_PATH"
    
    - name: Run safe tests
      run: swift test
    
    - name: Run formatting and linting checks
      if: matrix.validate
      run: make check

    - name: Verify CLI release packaging
      if: matrix.validate
      shell: bash
      run: |
        shellcheck scripts/*.sh
        version="$(sed -n 's/.*axorcVersion = "\([^"]*\)".*/\1/p' Sources/axorc/Models/AXORCModels.swift)"
        umask 077
        scripts/build-release-artifact.sh "$version" --adhoc
        verify_dir="$(mktemp -d)"
        trap 'rm -rf "$verify_dir"' EXIT
        for architecture in universal arm64 x86_64; do
          archive="dist/axorc-$version-macos-$architecture.zip"
          test "$(unzip -Z1 "$archive")" = "axorc"
          (cd dist && shasum -a 256 -c "$(basename "$archive").sha256")
          mkdir "$verify_dir/$architecture"
          ditto -x -k "$archive" "$verify_dir/$architecture"
          binary="$verify_dir/$architecture/axorc"
          test "$(stat -f '%Lp' "$binary")" = 755
          codesign --verify --strict "$binary"
          if [[ "$architecture" == universal ]]; then
            for expected_arch in arm64 x86_64; do
              lipo "$binary" -verify_arch "$expected_arch"
            done
          else
            test "$(lipo -archs "$binary")" = "$architecture"
            test "$(stat -f '%z' "$archive")" -lt "$(stat -f '%z' "dist/axorc-$version-macos-universal.zip")"
          fi
          if [[ "$architecture" == universal || "$architecture" == "$(uname -m)" ]]; then
            "$binary" --version | grep -Fx "axorc $version"
            "$binary" --help >/dev/null
          fi
        done
        scripts/render-homebrew-formula.sh "$version" --artifacts dist > /tmp/axorc.rb
        grep -Fq 'skip_clean "bin/axorc"' /tmp/axorc.rb
        ruby -c /tmp/axorc.rb

    - name: Retain ad-hoc packaging artifacts
      if: matrix.validate
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: axorc-adhoc-${{ github.sha }}
        path: |
          dist/axorc-*-macos-*.zip
          dist/axorc-*-macos-*.zip.sha256
        if-no-files-found: error
        retention-days: 7
